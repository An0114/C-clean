[package]
name = "engine"
version = "0.1.0"
description = "C-Disk Cleaner Rust 核心库（扫描/分级/执行/保险箱/审计，后续任务落地）"
edition.workspace = true
rust-version.workspace = true

[lib]
name = "engine"
path = "src/lib.rs"

[dependencies]
hex = "0.4.3"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.152"
sha2 = "0.10.9"
thiserror = "1"

[dev-dependencies]
tempfile = "3.27.0"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_System_RestartManager",
] }
