[package]
name = "engine"
version = "0.1.0"
description = "C-Disk Cleaner Rust 核心库（扫描/分级/执行/保险箱/审计，后续任务落地）"
edition.workspace = true
rust-version.workspace = true

[lib]
name = "engine"
path = "src/lib.rs"

[dependencies]
rusqlite = { version = "0.40.2", features = ["bundled"] }
thiserror = "1"

[dev-dependencies]
tempfile = "3.27.0"
