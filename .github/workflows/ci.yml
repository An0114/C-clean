# C-Disk Cleaner CI（task-006）。
# 项目「完全不做 macOS/Linux」，只在 windows-latest 上跑五道闸：
# fmt → clippy -D warnings → cargo test → pnpm install --frozen-lockfile → pnpm build。
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node + pnpm 11（对齐本地 Node 22 / pnpm 11）
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable; corepack prepare pnpm@11 --activate

      - name: Setup Rust（自动读取 rust-toolchain.toml）
        uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      # bugfix/task-035-release-signing：发版脚本的纯逻辑单测（node:test，无额外依赖）。
      # 覆盖版本号解析/注入、.sig 产物校验、latest.json 生成，守住两个发版 bug 不回归。
      - name: 发版脚本单测
        run: node --test scripts/release-lib.test.mjs

      # bugfix/task-050：bundle.resources 必须是映射式，且目标落在 rules/ 与 scripts/ 下。
      # 数组式会让资源落到 <安装目录>\_up_\_up_\rules\...，全新安装用户首次启动即不可用。
      - name: Tauri 资源映射契约
        run: node --test scripts/tauri-resources.test.mjs

      - name: Rustfmt 检查
        run: cargo fmt --all -- --check

      - name: Clippy（warning 即 fail）
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Rust 测试
        run: cargo test --workspace

      - name: 前端安装（frozen lockfile）
        run: pnpm install --frozen-lockfile

      - name: 前端 Lint
        run: pnpm --filter app lint

      - name: 前端测试
        run: pnpm --filter app test

      - name: 前端构建
        run: pnpm --filter app build

      # task-033：Tauri bundle 出 installer（nsis .exe + msi .msi）
      # windows-latest 默认预装 WebView2 Runtime，无需额外安装。
      #
      # bugfix/task-035-release-signing：tauri.conf.json 打开 bundle.createUpdaterArtifacts 后，
      # tauri build 会强制要求私钥（缺失直接报 "A public key has been found, but no private key"）。
      # CI 用一次性临时密钥签名，既让构建通过，又顺带守住「.sig 必须产出」这条回归。
      - name: 生成 CI 临时签名密钥
        shell: pwsh
        run: |
          $keyPath = Join-Path $env:RUNNER_TEMP "ci-signing.key"
          pnpm --filter app exec tauri signer generate -w $keyPath -p "" --ci --force
          if (-not (Test-Path $keyPath)) { Write-Host "::error::临时签名密钥没生成"; exit 1 }
          "TAURI_SIGNING_PRIVATE_KEY=$keyPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "TAURI_SIGNING_PRIVATE_KEY_PASSWORD=" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "临时签名密钥已生成: $keyPath"

      - name: Tauri build
        run: pnpm --filter app tauri build

      # 产物硬校验：安装包版本号与 tauri.conf.json 一致，且必须有成对 .sig
      - name: 校验打包产物（版本号 + .sig）
        run: node scripts/release-lib.mjs verify-artifacts --bundle target/release/bundle

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: cclean-windows-installer
          path: |
            target/release/bundle/nsis/*.exe
            target/release/bundle/nsis/*.sig
            target/release/bundle/msi/*.msi
            target/release/bundle/msi/*.sig
          if-no-files-found: error

      # 规则库自洽守卫：合并前挡住「手改 cache_rules.json 忘了更新 rules_meta.json」。
      # windows runner 带 autocrlf=true，checkout 出来的文件可能是 CRLF；
      # 这里先归一为 LF 再算哈希，与 git blob / rules_meta.json 的 LF 口径对齐。
      - name: 规则库 SHA-256 校验
        shell: pwsh
        run: |
          $text = [IO.File]::ReadAllText('rules/cache_rules.json') -replace "`r`n", "`n"
          $sha = [System.Security.Cryptography.SHA256]::Create()
          $hash = ($sha.ComputeHash([Text.Encoding]::UTF8.GetBytes($text)) | ForEach-Object { $_.ToString('x2') }) -join ''
          $meta = Get-Content rules/rules_meta.json -Raw | ConvertFrom-Json
          if ($hash -ne $meta.checksum_sha256) {
            Write-Error "checksum mismatch: expected $($meta.checksum_sha256), got $hash"
            exit 1
          }
          Write-Host "rules checksum OK: $hash"

      - name: 规则库 JSON 合法性
        shell: pwsh
        run: |
          Get-Content rules/cache_rules.json -Raw | ConvertFrom-Json | Out-Null
          Get-Content rules/rules_meta.json -Raw | ConvertFrom-Json | Out-Null
          Write-Host "rules JSON parse OK"
