# task-034：GitHub Release 发版 workflow。
# task-035：加 updater 签名 + latest.json 生成。
# fix(release): 改用 tauri-action 官方 action，修复版本号不生效 + 不生成 .sig 两个 bug。
#
# 两种触发方式：
#   1. workflow_dispatch 手动触发（输入 version，如 0.1.0）
#   2. push tag v* 自动发版（如 git tag v0.1.0 && git push --tags）
#
# 产出：把 tauri build 出的 .msi + .exe + latest.json 上传到 GitHub Release。
# 注意：workspace 模式下 bundle 输出在仓库根 target/release/bundle/，不是 app/src-tauri/target。
name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version (e.g. 0.1.0)"
        required: true
        type: string
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm（自动读取 package.json 的 packageManager 字段）
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      # ===== 注入版本号到 tauri.conf.json =====
      # workflow_dispatch 手动输入 或 git tag 触发，取其中一个。
      # 用正则替换顶层 "version" 字段，不重新序列化整个 JSON，保持原文件格式。
      - name: 注入版本号到 tauri.conf.json
        shell: pwsh
        run: |
          $ver = "${{ github.event.inputs.version || github.ref_name }}".TrimStart('v')
          $confPath = "app/src-tauri/tauri.conf.json"
          $content = Get-Content $confPath -Raw
          $oldVer = [regex]::Match($content, '"version":\s*"([^"]+)"').Groups[1].Value
          Write-Host "原版本: $oldVer  →  新版本: $ver"
          $newContent = $content -replace '"version":\s*"[^"]*"', "`"version`": `"$ver`""
          [System.IO.File]::WriteAllText((Resolve-Path $confPath), $newContent)

      # ===== 官方 tauri-action：构建 + 签名 + latest.json 生成 + Release 上传 =====
      # 官方 action 自动检测 TAURI_SIGNING_PRIVATE_KEY 环境变量并签名打包，
      # 自动生成 updater 用的 latest.json，自动上传所有 bundle 产物到 Release。
      # projectPath 指向 app 目录（pnpm monorepo 下的前端 + Tauri 壳目录）。
      - name: Build and Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: app
          tagName: v__VERSION__
          releaseName: v__VERSION__
          generateReleaseNotes: true
          uploadUpdaterJson: true
          # updater 优先用 NSIS (.exe) 包生成 latest.json，
          # 默认 false 会优先找 MSI，匹配不上签名就跳过生成。
          # Tauri v2 updater 标准使用 NSIS 包，必须设为 true。
          updaterJsonPreferNsis: true
