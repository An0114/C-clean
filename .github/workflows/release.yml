# task-034：GitHub Release 发版 workflow。
# 两种触发方式：
#   1. workflow_dispatch 手动触发（输入 version，如 0.1.0）
#   2. push tag v* 自动发版（如 git tag v0.1.0 && git push --tags）
# 产出：把 tauri build 出的 .msi + .exe 上传到 GitHub Release。
# 注意：workspace 模式下 bundle 输出在仓库根 target/release/bundle/，不是 app/src-tauri/target。
name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version (e.g. 0.1.0)"
        required: true
        type: string
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: Tauri build
        run: pnpm --filter app tauri build

      - name: 创建 Release 并上传 installer
        uses: softprops/action-gh-release@v2
        with:
          name: v${{ github.event.inputs.version || github.ref_name }}
          tag_name: v${{ github.event.inputs.version || github.ref_name }}
          files: |
            target/release/bundle/nsis/*.exe
            target/release/bundle/msi/*.msi
          generate_release_notes: true
