# task-034：GitHub Release 发版 workflow。
# task-035：加 updater 签名 + latest.json 生成。
#
# bugfix/task-035-release-signing：修两个 bug
#   ① 安装包版本号永远 0.1.0 —— 版本注入以前是内联 PowerShell 正则替换，改完不复验，
#      失败也静默；现在抽成 scripts/release-lib.mjs（可单测），写回后立刻
#      JSON.parse 复验，构建后还按安装包文件名硬校验版本号，对不上直接 CI 红灯。
#   ② 配了私钥却不生成 .sig —— 根因是 tauri.conf.json 缺 bundle.createUpdaterArtifacts
#      （Tauri 2 该字段默认 false，为 false 时 bundler 压根不会去读私钥，所以前面怎么
#      改私钥传递方式都没反应）。补上该开关，并加「安装包必须有成对 .sig」的硬校验。
#   ③ 私钥文件多写一个换行 → base64 解码失败 —— 见 "Setup signing key" 步骤注释。
#
# task-084 C3：ARM64 产物。
#   原来只打 windows-latest（x64）。现在 build 用一个 matrix，两个 runner 各自出包：
#     - windows-latest   → x86_64-pc-windows-msvc  → x64 安装包（含 NSIS/MSI + 签名）；
#     - windows-11-arm   → aarch64-pc-windows-msvc → arm64 安装包（含 NSIS/MSI + 签名）。
#   为什么拆成 build + publish 两个 job：两个 arch 各自 `softprops/action-gh-release`
#   直接上传会并发抢着 create release，有 422 竞态。改成 build 各自产出并上传
#   workflow artifact，publish 汇总后再创建一次 Release 统一上传——每次发版只建一次。
#
# 对比原版的变化：
#   - 每个 arch 的 bundle 输出到 target/<target>/release/bundle（Tauri 交叉/本机 target），
#     校验（verify-artifacts）按各自 BUNDLE_DIR 独立做；
#   - latest.json（updater 索引）只在 x64 出（x64 的 nsis 目录是干净的，findUpdaterArtifact
#     不会误挑到 arm64）。arm64 本轮以「Release 可下载安装包」交付，updater 的
#     arm64 索引入口留待后续（避免让 arm64 客户端读到唯一 x64 entry 后去拉 x64 安装包）；
#   - 便携版维持 x64 单架构（`if: matrix.arch == 'x64'`），不进 matrix。
#
# 两种触发方式：
#   1. workflow_dispatch 手动触发（输入 version，如 0.2.0）
#   2. push tag v* 自动发版（如 git tag v0.2.0 && git push --tags）
#
# 产出：把两架构的 .msi + .exe + .sig + latest.json + 便携版 zip/CLI 上传到 GitHub Release。
name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version (e.g. 0.2.0)"
        required: true
        type: string
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  # ===== 每个架构各自的构建 job（matrix）=====
  build:
    name: Build ${{ matrix.arch }}
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            arch: x64
          - platform: windows-11-arm
            target: aarch64-pc-windows-msvc
            arch: arm64
    env:
      # target/<target>/release/bundle —— Tauri 指定 --target 后 bundle 不在默认的
      # target/release/bundle，而是按 target 分目录。verify-artifacts / 汇总都以此为基。
      BUNDLE_DIR: target/${{ matrix.target }}/release/bundle
      TARGET: ${{ matrix.target }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm（自动读取 package.json 的 packageManager 字段）
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          # 显式带出目标 triple：arm64 runner 原生是 aarch64，交叉/本机路径都要指明确认，
          # 否则 default target 可能与 API 期望的 msvc triple 不一致。
          targets: ${{ matrix.target }}

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      # ===== 解析版本号（唯一来源）=====
      # 手动输入优先，没有则用 tag 名（v0.2.0）；分支名不是合法 semver 直接失败，
      # 不再像以前那样把 ref_name 原样塞进产物。
      - name: 解析并校验版本号
        shell: pwsh
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          $ver = node scripts/release-lib.mjs resolve-version --input $env:INPUT_VERSION --ref $env:REF_NAME
          if ($LASTEXITCODE -ne 0) { exit 1 }
          "RELEASE_VERSION=$ver" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "本次发版版本号: $ver"

      # ===== 注入版本号到 tauri.conf.json =====
      # 只改顶层 version，改完立刻复验；脚本内部 JSON.parse 断言，对不上直接非零退出。
      - name: 注入版本号到 tauri.conf.json
        shell: pwsh
        run: |
          node scripts/release-lib.mjs patch-conf --version $env:RELEASE_VERSION --conf app/src-tauri/tauri.conf.json
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Write-Host "--- 注入后的版本行 ---"
          Select-String -Path app/src-tauri/tauri.conf.json -Pattern '"version"' | ForEach-Object { Write-Host $_.Line.Trim() }

      # ===== 写入签名私钥到文件 =====
      # Tauri 把「整个文件内容」当成一整段 base64 解，多一个字节都解不开：
      # run 39940302050 就是因为这里给私钥补了 "\n"，bundler 报
      #   failed to decode base64 secret key: Invalid symbol 10, offset 348
      # 而且是在 msi 都打完、第 8 分钟才报。现在交给 release-lib.mjs write-key：
      # 剔除所有空白（CR/LF/空格）→ 校验 base64 与 minisign 头 → 原样写盘不加换行。
      - name: Setup signing key
        shell: pwsh
        env:
          SECRET_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          $keyDir = Join-Path $env:USERPROFILE ".tauri"
          New-Item -ItemType Directory -Force -Path $keyDir | Out-Null
          $keyPath = Join-Path $keyDir "cclean.key"
          node scripts/release-lib.mjs write-key --from-env SECRET_KEY --out $keyPath
          if ($LASTEXITCODE -ne 0) { exit 1 }
          "TAURI_SIGNING_PRIVATE_KEY=$keyPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "私钥路径: $keyPath"

      # ===== Tauri build =====
      # bundle.createUpdaterArtifacts=true 时 bundler 才会读私钥并产出 .sig。
      # --target 指定本架构的 triple，bundle 输出到 target/<target>/release/bundle。
      - name: Tauri build
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: pnpm --filter app tauri build --verbose --target $env:TARGET

      # ===== 列出产物（排障用）=====
      - name: 列出 bundle 产物
        shell: pwsh
        run: |
          Get-ChildItem $env:BUNDLE_DIR -Recurse -File | ForEach-Object {
            Write-Host $_.FullName.Replace("$PWD\", "")
          }

      # ===== 硬校验：版本号 + 签名（每个 arch 各自校验）=====
      - name: 校验产物（版本号 + .sig）
        shell: pwsh
        run: |
          node scripts/release-lib.mjs verify-artifacts --version $env:RELEASE_VERSION --bundle $env:BUNDLE_DIR
          if ($LASTEXITCODE -ne 0) { exit 1 }

      # ===== 便携版（task-079，仅 x64）=====
      #
      # **Tauri 2 没有 `bundle.windows.portable` 这个打包目标**（任务书假设的），
      # 官方给便携场景的机制是 `app.appDirectoriesOverride`：把 `app_data_dir()`
      # 等路径 API 的根改成一个**相对 exe 的目录**。相对路径只在「exe 所在目录可写」
      # 时有效（便携布局、target 目录），装到 Program Files 里会写失败——所以这个
      # 覆盖**绝不能**写进共享的 tauri.conf.json，只能通过 `--config` 只作用于
      # 便携版这一次构建。这正是 Tauri 官方文档给的建议做法。
      #
      # `--no-bundle`：便携版不需要安装包，只要裸 exe + 资源文件，自己打 zip。
      # C3：便携版不纳入 matrix，固定 x64（`if: matrix.arch == 'x64'`）。
      - name: 构建便携版（数据目录跟随 exe）
        if: matrix.arch == 'x64'
        shell: pwsh
        run: |
          pnpm --filter app tauri build --no-bundle --config src-tauri/tauri.portable.conf.json
          if ($LASTEXITCODE -ne 0) { exit 1 }
          if (-not (Test-Path "target/release/cdisk-cleaner.exe")) {
            throw "便携版 exe 未生成"
          }
          # CLI 是便携版的核心入口之一（task-079）。独立 crate，不走 Tauri 构建。
          cargo build --release -p c-clean-cli
          if ($LASTEXITCODE -ne 0) { exit 1 }
          if (-not (Test-Path "target/release/c-clean-cli.exe")) {
            throw "CLI exe 未生成"
          }

      - name: 打包便携版 zip
        if: matrix.arch == 'x64'
        shell: pwsh
        run: |
          $stage = "target/portable"
          if (Test-Path $stage) { Remove-Item $stage -Recurse -Force }
          New-Item -ItemType Directory -Force -Path $stage | Out-Null

          # 布局必须与 bundle.resources 的映射一致：rules/ 与提权 exe 在 exe 同级。
          # 扫描已全量 Rust 化，不再分发 scripts/；release 只从 exe 目录定位 rules/。
          Copy-Item "target/release/cdisk-cleaner.exe" $stage
          Copy-Item "target/release/c-clean-cli.exe" $stage
          Copy-Item "app/src-tauri/binaries/cclean-elevation.exe" $stage
          Copy-Item "rules" (Join-Path $stage "rules") -Recurse

          # portable_data 必须**存在且非空**：
          #   - 存在：CLI 用 `portable_data 是否 is_dir()` 判断便携布局；
          #   - 非空：`Compress-Archive` 会跳过空目录，纯空目录解压后就没了，
          #     CLI 会误判成安装版并回退到 %APPDATA%（数据「消失」）。
          $pd = Join-Path $stage "portable_data"
          New-Item -ItemType Directory -Force -Path $pd | Out-Null
          $note = "C-Disk Cleaner 便携版数据目录`r`n`r`n本目录存放数据库、保险箱与日志（便携版不写 %APPDATA%）。`r`n删掉本目录等于重置应用：扫描历史、保险箱里的可恢复条目都会丢。`r`n请勿把便携版放在只读位置（如 Program Files），否则写入会失败。"
          Set-Content -Path (Join-Path $pd "README.txt") -Value $note -Encoding utf8

          $zip = "C-DiskCleaner_$($env:RELEASE_VERSION)_portable_x64.zip"
          if (Test-Path $zip) { Remove-Item $zip -Force }
          Compress-Archive -Path (Join-Path $stage "*") -DestinationPath $zip -CompressionLevel Optimal
          if (-not (Test-Path $zip)) { throw "便携版 zip 未生成" }
          Get-ChildItem $zip | ForEach-Object {
            Write-Host "便携版: $($_.Name) ($([math]::Round($_.Length / 1MB, 2)) MiB)"
          }
          # 自检：zip 里必须能看到 exe 与 portable_data 的说明文件
          $names = (Get-ChildItem $stage -Recurse -File | ForEach-Object { $_.FullName.Replace("$PWD\", "") })
          Write-Host "--- 便携版内容 ---"
          $names | ForEach-Object { Write-Host $_ }
          # -like 通配符：反斜杠按字面处理，避免 -match 正则里反斜杠双重转义的坑
          # （PowerShell 双引号不转义 \，写 \\\\ 会变成正则匹配两个反斜杠，永远匹配不上单 \ 路径）。
          if (-not ($names -like "*portable_data\README.txt")) { throw "portable_data 说明文件缺失" }

      # ===== 汇总到统一的 upload/ 目录，交给 upload-artifact =====
      # 固定顶层目录名 upload/，两个 arch 都往各自工作区的 upload/ 塞 bundle 内容，
      # 下载时再加上 arch 前缀即可区分，不会互踩。
      - name: 汇总本架构产物到 upload/
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path upload | Out-Null
          Copy-Item -Path "$env:BUNDLE_DIR/*" -Destination upload -Recurse
          if ($env:MATRIX_ARCH -eq 'x64') {
            # 便携 zip 与 CLI 只在 x64 job 里有，一并进 upload/。
            Copy-Item "C-DiskCleaner_*_portable_x64.zip" upload
            Copy-Item "target/release/c-clean-cli.exe" upload
          }
        env:
          MATRIX_ARCH: ${{ matrix.arch }}

      # ===== 生成 latest.json（updater 索引，仅 x64）=====
      # 必须在「未合并 arm64」的干净 x64 目录上跑：合并后 nsis/ 里会同时有 x64 和
      # arm64 两个安装包，findUpdaterArtifact 优先挑 nsis/ 下成对 .sig，但不保证挑到 x64。
      - name: Generate latest.json
        if: matrix.arch == 'x64'
        shell: pwsh
        run: |
          node scripts/release-lib.mjs generate-latest --version $env:RELEASE_VERSION --bundle upload --repo ${{ github.repository }} --out upload/latest.json
          if ($LASTEXITCODE -ne 0) { exit 1 }

      # 上传为 workflow artifact，publish job 下载后统一建 Release 上传。
      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.arch }}
          path: upload
          if-no-files-found: error

  # ===== 汇总 job：下载两架构产物，只创建一次 Release 并上传 =====
  publish:
    needs: build
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # resolve-version 走 release-lib.mjs（Node），这里只需要 node。
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # ===== 解析并校验版本号（作 Release 名/tag 用）=====
      - name: 解析并校验版本号
        shell: pwsh
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          $ver = node scripts/release-lib.mjs resolve-version --input $env:INPUT_VERSION --ref $env:REF_NAME
          if ($LASTEXITCODE -ne 0) { exit 1 }
          "RELEASE_VERSION=$ver" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: 下载 x64 产物
        uses: actions/download-artifact@v4
        with:
          name: dist-x64
          path: dist-x64

      - name: 下载 arm64 产物
        uses: actions/download-artifact@v4
        with:
          name: dist-arm64
          path: dist-arm64

      # ===== 创建 Release 并上传所有产物 =====
      # .msi / .exe / .sig / latest.json 全部上传，确保不漏；两个架构各自成对。
      #
      # task-054：补 target_commitish —— tag 精确指向触发本次发版的 commit。
      # 不指定时 GitHub 按默认分支（main）HEAD 建 tag，若 workflow_dispatch 之后
      # main 又进了新 commit，tag 就会指向一个「从未构建过的 commit」，源码与产物
      # 对不上（产物是从 github.sha 那次 checkout 构建的）。updater 的 tag 溯源
      # 与事后排查都依赖这条对应关系。
      - name: Create Release and upload all artifacts
        uses: softprops/action-gh-release@v2
        with:
          name: v${{ env.RELEASE_VERSION }}
          tag_name: v${{ env.RELEASE_VERSION }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: |
            dist-x64/upload/nsis/*.exe
            dist-x64/upload/nsis/*.sig
            dist-x64/upload/msi/*.msi
            dist-x64/upload/msi/*.sig
            dist-x64/upload/c-clean-cli.exe
            dist-x64/upload/C-DiskCleaner_*_portable_x64.zip
            dist-x64/upload/latest.json
            dist-arm64/upload/nsis/*.exe
            dist-arm64/upload/nsis/*.sig
            dist-arm64/upload/msi/*.msi
            dist-arm64/upload/msi/*.sig