# task-034：GitHub Release 发版 workflow。
# task-035：加 updater 签名 + latest.json 生成。
# fix(release): 改用 tauri-action 官方 action，修复版本号不生效 + 不生成 .sig 两个 bug。
#
# 两种触发方式：
#   1. workflow_dispatch 手动触发（输入 version，如 0.1.0）
#   2. push tag v* 自动发版（如 git tag v0.1.0 && git push --tags）
#
# 产出：把 tauri build 出的 .msi + .exe + latest.json 上传到 GitHub Release。
# 注意：workspace 模式下 bundle 输出在仓库根 target/release/bundle/，不是 app/src-tauri/target。
name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version (e.g. 0.1.0)"
        required: true
        type: string
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm（自动读取 package.json 的 packageManager 字段）
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      # ===== 注入版本号到 tauri.conf.json =====
      # workflow_dispatch 手动输入 或 git tag 触发，取其中一个。
      # 用正则替换顶层 "version" 字段，不重新序列化整个 JSON，保持原文件格式。
      - name: 注入版本号到 tauri.conf.json
        shell: pwsh
        run: |
          $ver = "${{ github.event.inputs.version || github.ref_name }}".TrimStart('v')
          $confPath = "app/src-tauri/tauri.conf.json"
          $content = Get-Content $confPath -Raw
          $oldVer = [regex]::Match($content, '"version":\s*"([^"]+)"').Groups[1].Value
          Write-Host "原版本: $oldVer  →  新版本: $ver"
          $newContent = $content -replace '"version":\s*"[^"]*"', "`"version`": `"$ver`""
          [System.IO.File]::WriteAllText((Resolve-Path $confPath), $newContent)

      # ===== 官方 tauri-action：构建 + 签名 + Release 上传 =====
      # 官方 action 负责构建、签名、上传 .msi/.exe/.sig 到 Release。
      # uploadUpdaterJson 关掉（官方 action 的 latest.json 生成有 bug，匹配不上 Tauri v2 的文件名格式），
      # latest.json 由下面的手写步骤生成。
      - name: Build and Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: app
          tagName: v__VERSION__
          releaseName: v__VERSION__
          generateReleaseNotes: true
          uploadUpdaterJson: false

      # ===== 手写生成 latest.json（updater 索引文件）=====
      # 官方 tauri-action 的 latest.json 生成逻辑有 bug，这里手写：
      # 递归扫描整个 bundle 目录找 .sig 文件，优先用 NSIS 包的签名。
      - name: Generate latest.json
        shell: pwsh
        run: |
          $ver = "${{ github.event.inputs.version || github.ref_name }}".TrimStart('v')

          Write-Host "=== 扫描 bundle 目录结构 ==="
          Get-ChildItem target/release/bundle -Recurse -File | ForEach-Object {
            Write-Host $_.FullName.Replace("$PWD\", "")
          }

          # 递归找所有 .sig 文件，优先选 NSIS 目录下的（updater 标准用 NSIS）
          $allSigs = Get-ChildItem target/release/bundle -Recurse -Filter "*.sig"
          Write-Host "`n找到 $($allSigs.Count) 个 .sig 文件"

          $sig = $allSigs | Where-Object { $_.FullName -match '\\nsis\\' } | Select-Object -First 1
          if (-not $sig) {
            Write-Host "NSIS 目录下没找到 .sig，用第一个找到的"
            $sig = $allSigs | Select-Object -First 1
          }

          if (-not $sig) {
            Write-Host "::error::整个 bundle 目录下都没找到 .sig 签名文件"
            exit 1
          }

          # 从 .sig 文件名反推对应的安装包文件名（去掉 .sig 后缀）
          $installerPath = $sig.FullName -replace '\.sig$', ''
          if (-not (Test-Path $installerPath)) {
            Write-Host "::error::找不到签名对应的安装包: $installerPath"
            exit 1
          }
          $installer = Get-Item $installerPath

          Write-Host "`n找到签名文件: $($sig.FullName)"
          Write-Host "对应安装包: $($installer.Name)"

          $sigContent = Get-Content $sig.FullName -Raw
          $notes = "v$ver 发布"
          $pubDate = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
          $downloadUrl = "https://github.com/An0114/C-clean/releases/download/v$ver/$($installer.Name)"

          $json = @{
            version = $ver
            notes = $notes
            pub_date = $pubDate
            platforms = @{
              "windows-x86_64" = @{
                signature = $sigContent.Trim()
                url = $downloadUrl
              }
            }
          } | ConvertTo-Json -Depth 5

          $json | Out-File -FilePath latest.json -Encoding utf8
          Write-Host "`n=== latest.json 生成成功 ==="
          Get-Content latest.json

      # ===== 补传 .sig 签名文件 + latest.json 到 Release =====
      # tauri-action 只上传了 .msi/.exe 安装包，.sig 文件没传，这里补全。
      # softprops/action-gh-release 会自动找到 tag 对应的 Release，追加文件上去。
      - name: Upload .sig files and latest.json to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.event.inputs.version || github.ref_name }}
          files: |
            target/release/bundle/**/*.sig
            latest.json
