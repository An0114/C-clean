# task-034：GitHub Release 发版 workflow。
# task-035：加 updater 签名 + latest.json 生成。
# 两种触发方式：
#   1. workflow_dispatch 手动触发（输入 version，如 0.1.0）
#   2. push tag v* 自动发版（如 git tag v0.1.0 && git push --tags）
# 产出：把 tauri build 出的 .msi + .exe 上传到 GitHub Release，并生成 signed latest.json。
# 注意：workspace 模式下 bundle 输出在仓库根 target/release/bundle/，不是 app/src-tauri/target。
name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version (e.g. 0.1.0)"
        required: true
        type: string
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm（自动读取 package.json 的 packageManager 字段）
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      # ===== 新增：把手动输入的版本号写进 tauri.conf.json =====
      - name: 注入版本号到 tauri.conf.json
        shell: pwsh
        run: |
          $ver = "${{ github.event.inputs.version || github.ref_name }}".TrimStart('v')
          # 你的 tauri.conf.json 路径（pnpm --filter app 说明在 app/ 目录下）
          $confPath = "app/src-tauri/tauri.conf.json"
          $conf = Get-Content $confPath -Raw | ConvertFrom-Json
          Write-Host "原版本: $($conf.version)  →  新版本: $ver"
          $conf.version = $ver
          $json = $conf | ConvertTo-Json -Depth 20
          [System.IO.File]::WriteAllText((Resolve-Path $confPath), $json)

      - name: Tauri build
        run: pnpm --filter app tauri build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

# ========== 新增：调试2 - 列出所有 bundle 产物，看看到底生成了什么 ==========
      - name: Debug - 列出 bundle 目录所有文件
        shell: pwsh
        run: |
          Write-Host "=== bundle 目录下所有文件 ==="
          Get-ChildItem target/release/bundle -Recurse -File | ForEach-Object {
            Write-Host $_.FullName.Replace("$PWD\", "")
          }

      # task-035：根据 .msi + 其 .sig 生成 latest.json（updater 读取的元信息）。
      # 若未配置签名 secret，则跳过此步（不生成 latest.json，updater 暂不可用）。
      - name: Generate latest.json
        shell: pwsh
        run: |
          $ver = "${{ github.event.inputs.version || github.ref_name }}".TrimStart('v')

          # 同时找 msi 和 nsis 下的 .sig，哪个有用用哪个
          $sig = Get-ChildItem target/release/bundle -Recurse -Filter "*.sig" | Select-Object -First 1
          if (-not $sig) {
            Write-Host "::error::整个 bundle 目录下没有任何 .sig 文件，签名没执行。请看上面 Debug 步骤的输出。"
            exit 1
          }

          # 找到对应的安装包（.sig 文件名 = 安装包文件名 + .sig）
          $installerPath = $sig.FullName -replace '\.sig$', ''
          $installer = Get-Item $installerPath
          Write-Host "找到签名文件: $($sig.Name)"
          Write-Host "对应安装包: $($installer.Name)"
          
          # $msi = Get-ChildItem target/release/bundle/msi/*.msi | Select-Object -First 1
          # $sig = Get-ChildItem "$($msi.FullName).sig" -ErrorAction SilentlyContinue
          # if (-not $sig) {
          #   Write-Host "::warning::未找到 .sig 文件（未配置 TAURI_SIGNING_PRIVATE_KEY），跳过 latest.json 生成"
          #   exit 0
          # }
          
          $sigContent = Get-Content $sig.FullName -Raw
          $notes = "v$ver 发布"
          $pubDate = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
          $json = @{
            version = $ver
            notes = $notes
            pub_date = $pubDate
            platforms = @{
              "windows-x86_64" = @{
                signature = $sigContent.Trim()
                url = "https://github.com/An0114/C-clean/releases/download/v$ver/$($msi.Name)"
              }
            }
          } | ConvertTo-Json -Depth 5
          $json | Out-File -FilePath latest.json -Encoding utf8
          Get-Content latest.json

      - name: 创建 Release 并上传 installer + latest.json
        uses: softprops/action-gh-release@v2
        with:
          name: v${{ github.event.inputs.version || github.ref_name }}
          tag_name: v${{ github.event.inputs.version || github.ref_name }}
          files: |
            target/release/bundle/nsis/*.exe
            target/release/bundle/msi/*.msi
            latest.json
          generate_release_notes: true
