# task-034：GitHub Release 发版 workflow。
# task-035：加 updater 签名 + latest.json 生成。
# 两种触发方式：
#   1. workflow_dispatch 手动触发（输入 version，如 0.1.0）
#   2. push tag v* 自动发版（如 git tag v0.1.0 && git push --tags）
# 产出：把 tauri build 出的 .msi + .exe 上传到 GitHub Release，并生成 signed latest.json。
# 注意：workspace 模式下 bundle 输出在仓库根 target/release/bundle/，不是 app/src-tauri/target。
name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version (e.g. 0.1.0)"
        required: true
        type: string
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      # task-035：把 GitHub Secret 里的签名私钥写到 ~/.tauri/cclean.key，
      # tauri build 会自动用它签 .msi/.exe（生成同名 .sig）。
      - name: Setup signing key
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        shell: pwsh
        run: |
          if (-not $env:TAURI_SIGNING_PRIVATE_KEY) {
            Write-Host "::warning::TAURI_SIGNING_PRIVATE_KEY secret not set; updater 签名将跳过"
            exit 0
          }
          New-Item -Path "$env:USERPROFILE\.tauri" -ItemType Directory -Force | Out-Null
          Set-Content -Path "$env:USERPROFILE\.tauri\cclean.key" -Value $env:TAURI_SIGNING_PRIVATE_KEY -NoNewline
          Write-Host "signing key written"

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: Tauri build
        run: pnpm --filter app tauri build
        env:
          TAURI_SIGNING_PRIVATE_KEY_PATH: ${{ env.USERPROFILE }}\.tauri\cclean.key

      # task-035：根据 .msi + 其 .sig 生成 latest.json（updater 读取的元信息）。
      - name: Generate latest.json
        shell: pwsh
        run: |
          $ver = "${{ github.event.inputs.version || github.ref_name }}".TrimStart('v')
          $msi = Get-ChildItem target/release/bundle/msi/*.msi | Select-Object -First 1
          $sig = Get-ChildItem "$($msi.FullName).sig" -ErrorAction SilentlyContinue
          if (-not $sig) {
            Write-Host "::error::未找到 .sig 文件，签名可能失败"
            exit 1
          }
          $sigContent = Get-Content $sig.FullName -Raw
          $notes = "v$ver 发布"
          $pubDate = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
          $json = @{
            version = $ver
            notes = $notes
            pub_date = $pubDate
            platforms = @{
              "windows-x86_64" = @{
                signature = $sigContent.Trim()
                url = "https://github.com/An0114/C-clean/releases/download/v$ver/$($msi.Name)"
              }
            }
          } | ConvertTo-Json -Depth 5
          $json | Out-File -FilePath latest.json -Encoding utf8
          Get-Content latest.json

      - name: 创建 Release 并上传 installer + latest.json
        uses: softprops/action-gh-release@v2
        with:
          name: v${{ github.event.inputs.version || github.ref_name }}
          tag_name: v${{ github.event.inputs.version || github.ref_name }}
          files: |
            target/release/bundle/nsis/*.exe
            target/release/bundle/msi/*.msi
            latest.json
          generate_release_notes: true
